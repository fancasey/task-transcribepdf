_ > nanoagent.plugin.v0001.ManifestConfig:
id: transcribe-exams
name: Organize Exam Questions
version: 0.10.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_pdf:
    description: Extract embedded text from up to five pages of the original Algebra II Regents exam PDF
  save_transcription:
    description: Save exam questions and their subquestions as JSON

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  transcribe-exams:
    description: Organize the August 2026 Algebra II Regents exam by question and subquestion
    runner: agent
    tools: [read_pdf, save_transcription]
    reference: null
    instructions: |-
      Transcribe only the inclusive start_page through end_page interval supplied by the user.
      Reject intervals outside pages 1-28 or longer than five pages. Do not read outside this interval.
      Read the selected pages in increasing order, up to five pages per call.
      Use printed question numbers as string keys. Each record has prompt, subquestions, and pages.
      pages lists every one-based PDF page containing the question, including continuations.
      Include only complete questions: omit any question whose beginning or continuation falls
      outside the interval. In particular, question 36 requires both pages 22 and 23.
      Keep shared setup, options, and single-response instructions in prompt. Choices are not
      subquestions. Put separately printed response prompts in subquestions in printed order.
      Join continuations within the interval. Skip booklet instructions, headers, footers, blank
      work space, and reference sheets. Preserve extracted math and relevant diagram/table text;
      do not solve or reconstruct missing visual information.
      Save start_page, end_page, and questions using save_transcription; an empty questions object
      is correct for intervals with no complete questions. Return the saved path.
