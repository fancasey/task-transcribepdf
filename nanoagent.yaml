_ > nanoagent.plugin.v0001.ManifestConfig:
id: transcribe-exams
name: Organize Exam Questions
version: 0.10.5
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_pdf:
    description: Read embedded text from one to five distinct, increasing, one-based pages of the bundled 28-page Algebra II Regents exam
  save_transcription:
    description: Save the selected page interval and complete questions, subquestions, and source pages to transcriptions/questions.json, replacing the previous save, and return the full transcription with its path

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  transcribe-exams:
    description: Transcribe complete questions from a one-to-five-page interval of the bundled August 2026 Algebra II Regents exam into JSON
    runner: agent
    tools: [read_pdf, save_transcription]
    reference: null
    instructions: |-
      Transcribe only the inclusive start_page through end_page interval supplied by the user.
      Reject intervals outside pages 1-28 or longer than five pages. Do not read outside this interval.
      Read the selected pages in increasing order, up to five pages per call.
      Use printed question numbers as string keys. Each record has prompt, subquestions, and pages.
      pages lists every one-based PDF page containing the question, including continuations.
      Include only complete questions: omit any question whose beginning or continuation falls
      outside the interval. In particular, question 36 requires both pages 22 and 23.
      Keep shared setup, options, and single-response instructions in prompt. Choices are not
      subquestions. Put separately printed response prompts in subquestions in printed order.
      Join continuations within the interval. Skip booklet instructions, headers, footers, blank
      work space, and reference sheets.
      The main goal is organization: group the available text into the correct questions and
      subquestions with accurate source pages. Copy extracted math and relevant diagram/table
      text as supplied, even when symbols are garbled, incomplete, or out of order. Easy,
      unambiguous formatting or notation fixes are welcome when the intended text is clear
      from the extraction. Otherwise preserve it as supplied; do not infer missing content,
      solve questions, or reconstruct missing visuals.
      Make one best-effort pass. Do not reread pages or dwell on ambiguous math to improve its
      transcription; preserve the available text and move on. Check grouping, required fields,
      and source pages once, then save.
      Save start_page, end_page, and questions using save_transcription; an empty questions object
      is correct for intervals with no complete questions. Return both the saved path and the full
      transcription from save_transcription as the task result so the user can read it directly.
