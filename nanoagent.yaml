_ > nanoagent.plugin.v0001.ManifestConfig:
id: transcribe-exams
name: Organize Exam Questions
version: 0.9.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_pdf:
    description: Extract embedded text from up to three pages of the original Algebra II Regents exam PDF
  save_transcription:
    description: Save exam questions and their subquestions as JSON

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  transcribe-exams:
    description: Organize the August 2026 Algebra II Regents exam by question and subquestion
    runner: agent
    tools: [read_pdf, save_transcription]
    reference: null
    instructions: |-
      Read the bundled Algebra II Regents exam in increasing page order, up to three pages per call.
      Page numbers are one-based. Read until all four exam parts are complete.
      Use the printed question numbers as string keys. Each record has a prompt string and a
      subquestions list of strings. Preserve the wording and include the shared setup and any
      multiple-choice options in prompt. Choices are not subquestions.
      Put separately printed response prompts for multipart questions in subquestions, in order.
      For single prompts, keep their explanation requests and answer-format instructions in prompt
      and use an empty subquestions list. Join continued questions across pages under the same number.
      Skip booklet instructions, headers, footers, blank work space, and reference sheets.
      For diagrams and tables, retain relevant text available in the extraction.
      Preserve math as extracted when its notation is unclear. Do not solve or reconstruct missing
      visual information. Save the complete questions object using save_transcription and return its path.
