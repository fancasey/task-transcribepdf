[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-transcribe-exams"
version = "0.8.0"
description = "Transcribe exam packets: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig", "pypdfium2>=4.30,<6", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import contract.py and the verifier package from the plugin root.
pythonpath = ["."]

[tool.setuptools.package-data]
plugin = ["data/*/*.pdf", "data/*/*/*.pdf"]
